<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — NextGen-Nordic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Source+Serif+4:opsz,wght@8..60,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#F1F2EE;color:#16191B;font-family:"Source Serif 4",Georgia,serif;
       font-size:18px;line-height:1.6;padding:24px;text-align:center}
  .box{max-width:44ch}
  .code{font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.16em;
        text-transform:uppercase;color:#5B6560;margin-bottom:18px}
  h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;
     font-size:2.1rem;letter-spacing:-0.02em;line-height:1.1;margin:0 0 14px}
  p{color:#5B6560;margin:0 0 26px}
  a{display:inline-block;background:#0E6A5E;color:#fff;text-decoration:none;
    font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;
    font-size:.95rem;padding:13px 22px;border-radius:3px}
  a:focus-visible{outline:2px solid #16191B;outline-offset:3px}
</style>
</head>
<body>
  <div class="box">
    <div class="code">Error 404</div>
    <h1>This page isn't here</h1>
    <p>Which is, admittedly, a small example of the kind of thing we normally fix. Everything we do lives on the front page.</p>
    <a href="/">Go to the front page</a>
  </div>
</body>
</html>
